<!-- ChronoGaze main chart. app.py fills in __PAYLOAD__, __HEIGHT__ and __LWC_URL__. -->
<div id="wrap" style="height:__HEIGHT__px">
  <div id="box">
    <div id="sunbg"></div>
    <div id="chart"></div>
    <div id="sunfg"></div>
    <div id="tgl"></div>
    <div id="legend"></div>
    <div id="tip" hidden></div>
    <div id="scalebar" role="toolbar" aria-label="Skala harga">
      <button type="button" data-k="pct" title="Label sumbu Y dalam persen; 0% = Open bar paling kiri yang terlihat">%</button>
      <button type="button" data-k="log" title="Skala logaritmik (jarak sama = persentase sama)">log</button>
      <button type="button" data-k="auto" title="Sumbu harga otomatis menyesuaikan high/low yang terlihat">auto</button>
    </div>
  </div>
  <aside id="ind" aria-label="Indikator">
    <div class="h">Indikator</div>
    <div id="indList"></div>
  </aside>
</div>
<style>
  html, body { margin:0; background:#131722; font-family:-apple-system,Segoe UI,Roboto,sans-serif; color:#d1d4dc; }
  #wrap { display:flex; width:100%; }
  #box { position:relative; flex:1; min-width:0; height:100%; background:#131722; overflow:hidden; }
  #chart { position:absolute; inset:0; z-index:1; }
  #sunbg, #sunfg { position:absolute; left:0; top:0; overflow:hidden; pointer-events:none; }
  #sunbg { z-index:0; }
  #sunfg { z-index:2; }
  #sunbg div { position:absolute; top:0; bottom:0; }
  #tgl { position:absolute; left:0; top:0; z-index:2; overflow:hidden; pointer-events:none; }
  #tgl .ln { position:absolute; top:0; bottom:0; width:0; border-left:2px solid; }
  #tgl .ln.near { border-left-style:dashed; }
  #tgl .lb { position:absolute; top:30px; transform:translateX(-50%); white-space:nowrap; font-size:11px; font-weight:600;
             padding:2px 6px; border-radius:4px; color:#131722; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .zs { position:absolute; width:22px; height:22px; margin-left:-11px; margin-top:-11px; border-radius:50%;
        display:flex; align-items:center; justify-content:center; font-size:14px; line-height:1;
        color:#131722; cursor:default; pointer-events:auto; box-shadow:0 0 0 1px rgba(0,0,0,.35); }
  .zs:hover { box-shadow:0 0 0 2px #d1d4dc; }
  #legend { position:absolute; top:8px; left:12px; z-index:3; font-size:13px; pointer-events:none; }
  #legend .t { font-size:15px; font-weight:600; margin-right:10px; }
  #legend .k { color:#787b86; margin-left:8px; }
  #tip { position:absolute; z-index:4; width:280px; max-width:calc(100% - 16px); box-sizing:border-box;
         background:#1e222d; border:1px solid #363a45; border-radius:6px; padding:9px 11px;
         font-size:12px; line-height:1.45; box-shadow:0 6px 18px rgba(0,0,0,.45); pointer-events:none; }
  #tip .ttl { font-size:14px; font-weight:600; }
  #tip .per { color:#9598a1; margin:2px 0 6px; }
  #tip .lab { color:#9598a1; margin-top:5px; }
  #tip .chips { display:flex; flex-wrap:wrap; gap:3px; margin-top:2px; }
  #tip .chips span { background:#2a2e39; border-radius:3px; padding:1px 6px; }
  #scalebar { position:absolute; right:0; bottom:0; z-index:3; display:flex; align-items:center; gap:1px;
              padding:0 3px; background:#131722; border-top:1px solid #2a2e39; border-left:1px solid #2a2e39; box-sizing:border-box; }
  #scalebar button { border:0; border-radius:3px; background:none; color:#787b86; font:inherit; font-size:11px;
                     line-height:1; padding:3px 5px; cursor:pointer; }
  #scalebar button:hover { background:#2a2e39; color:#d1d4dc; }
  #scalebar button.on { color:#2962ff; }
  #scalebar button:focus-visible { outline:2px solid #2962ff; outline-offset:-2px; }
  #ind { width:150px; flex:none; border-left:1px solid #2a2e39; background:#131722; padding:8px 6px;
         box-sizing:border-box; overflow-y:auto; }
  #ind .h { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#787b86; padding:0 4px 6px; }
  .ind-row { display:flex; align-items:center; gap:7px; width:100%; min-height:30px; padding:4px; border:0;
             border-radius:4px; background:none; color:#d1d4dc; font:inherit; font-size:13px; text-align:left; cursor:pointer; }
  .ind-row:hover { background:#2a2e39; }
  .ind-row:focus-visible { outline:2px solid #2962ff; outline-offset:-2px; }
  .ind-row svg { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:2;
                 stroke-linecap:round; stroke-linejoin:round; }
  .ind-row.off { color:#5d606b; }
  .ind-row.off .nm { text-decoration:line-through; }
  .ind-opt { display:flex; align-items:center; gap:6px; padding:0 4px 6px 27px; font-size:12px; color:#9598a1; }
  .ind-opt input { width:46px; box-sizing:border-box; background:#1e222d; color:#d1d4dc; border:1px solid #363a45;
                   border-radius:4px; padding:2px 4px; font:inherit; }
  .ind-opt input:focus { outline:none; border-color:#2962ff; }
  .ind-opt.off { display:none; }
  @media (max-width:560px) { #ind { width:44px; } #ind .h, .ind-row .nm, .ind-opt { display:none; } }
</style>
<script src="__LWC_URL__"></script>
<script>
const data = __PAYLOAD__;
const box = document.getElementById('box');
const scalebar = document.getElementById('scalebar');
const el = document.getElementById('chart');
const chart = LightweightCharts.createChart(el, {
  autoSize: true,
  // transparent so the Sun in Sign blocks behind the chart show through
  layout: { background: { type: 'solid', color: 'rgba(0,0,0,0)' }, textColor: '#d1d4dc' },
  grid: { vertLines: { color: 'rgba(42,46,57,.6)' }, horzLines: { color: 'rgba(42,46,57,.6)' } },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  rightPriceScale: { borderColor: '#2a2e39', scaleMargins: { top: 0.08, bottom: 0.27 } },
  timeScale: { borderColor: '#2a2e39', rightOffset: 5 },
});
const ts = chart.timeScale();
const candle = chart.addCandlestickSeries({
  upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
  wickUpColor: '#26a69a', wickDownColor: '#ef5350',
});
candle.setData(data.candles);
// Numbers in Indonesian style: '.' groups thousands, ',' marks decimals (1.000,5).
const idNum = (x, min, max) => x.toLocaleString('id-ID', { minimumFractionDigits: min, maximumFractionDigits: max });
const idPrice = p => idNum(p, 0, 2);
const idPct = v => (v < 0 ? '−' : v > 0 ? '+' : '') + idNum(Math.abs(v), 2, 2) + '%';
const idVol = v => {
  const a = Math.abs(v);
  for (const [n, u] of [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']]) if (a >= n) return idNum(v / n, 0, 2) + u;
  return idNum(v, 0, 0);
};
candle.applyOptions({ priceFormat: { type: 'custom', formatter: idPrice, minMove: 0.01 } });
const vol = chart.addHistogramSeries({ priceFormat: { type: 'custom', formatter: idVol, minMove: 1 }, priceScaleId: 'vol' });
chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.74, bottom: 0.13 } });
vol.setData(data.volumes);

// New/full moon row along the bottom of the chart. The series is invisible;
// it only carries the emoji markers and the empty future bars.
const moon = chart.addLineSeries({
  priceScaleId: 'moon', color: 'rgba(0,0,0,0)', lineVisible: false,
  lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false,
});
chart.priceScale('moon').applyOptions({ visible: false, scaleMargins: { top: 0.96, bottom: 0.01 } });
moon.setData(data.moonSeries);
const moonByTime = new Map(data.moonMarkers.map(m => [m.time, m.id.split('|')]));

// ---------------- Sun in Sign ----------------
// Blocks behind the chart, 80% transparent, coloured by element; the sign's
// symbol sits in the middle of the visible part of each block, in a row
// just above the moon row. Hovering the symbol shows the boosted tags.
const ELEMENT_RGB = { Water: '120,170,255', Fire: '255,128,128', Air: '130,215,150', Earth: '255,225,120' };
const rgbOf = sign => ELEMENT_RGB[(data.sunInfo[sign] || {}).element] || '180,180,180';
const sunbg = document.getElementById('sunbg'), sunfg = document.getElementById('sunfg'), tip = document.getElementById('tip');
const pad = n => String(n).padStart(2, '0');
const dmy = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(2, 4)} ${s.slice(11, 16)}` : '…';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chips = s => s ? `<div class="chips">${s.split(';').map(x => x.trim()).filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('')}</div>` : '<div style="color:#5d606b">—</div>';
let sunOn = true, sunFrame = 0;

function drawSun() {
  sunFrame = 0;
  sunbg.innerHTML = ''; sunfg.innerHTML = '';
  if (!sunOn || !data.sunSegs.length) { tip.hidden = true; return; }
  const pw = el.clientWidth - chart.priceScale('right').width();
  const ph = el.clientHeight - ts.height();
  scalebar.style.height = ts.height() + 'px';
  for (const layer of [sunbg, sunfg]) { layer.style.width = pw + 'px'; layer.style.height = ph + 'px'; }
  const r = ts.getVisibleLogicalRange();
  if (!r) return;
  const y = Math.round(ph * 0.905);
  // logicalToCoordinate only takes whole bar indexes, so a block's edges are
  // its first/last bar centre minus/plus half the bar spacing.
  const half = ts.options().barSpacing / 2;
  let bg = '', fg = '';
  data.sunSegs.forEach((s, i) => {
    if (s.to + 0.5 < r.from || s.from - 0.5 > r.to) return;
    const c0 = ts.logicalToCoordinate(s.from), c1 = ts.logicalToCoordinate(s.to);
    if (c0 === null || c1 === null) return;
    const x0 = c0 - half, x1 = c1 + half;
    const rgb = rgbOf(s.sign);
    bg += `<div style="left:${x0}px;width:${Math.max(0, x1 - x0)}px;background:rgba(${rgb},.2)"></div>`;
    const a = Math.max(x0, 0), b = Math.min(x1, pw);           // visible part only
    if (b - a < 24) return;
    const info = data.sunInfo[s.sign] || {};
    fg += `<div class="zs" data-i="${i}" style="left:${(a + b) / 2}px;top:${y}px;background:rgb(${rgb})" ` +
          `aria-label="${s.sign}">${info.symbol || '?'}&#xFE0E;</div>`;
  });
  sunbg.innerHTML = bg; sunfg.innerHTML = fg;
}
const redrawSun = () => { if (!sunFrame) sunFrame = requestAnimationFrame(drawSun); };
ts.subscribeVisibleLogicalRangeChange(redrawSun);
new ResizeObserver(redrawSun).observe(el);

sunfg.addEventListener('mouseover', e => {
  const z = e.target.closest('.zs');
  if (!z) return;
  const s = data.sunSegs[+z.dataset.i], info = data.sunInfo[s.sign] || {};
  tip.innerHTML = `<div class="ttl">${info.symbol}&#xFE0E; ${esc(s.sign)} <span style="color:#9598a1;font-weight:400">· ${esc(info.element || '')}</span></div>` +
    `<div class="per">Sun in ${esc(s.sign)}: ${dmy(s.start)} – ${dmy(s.end)} WIB</div>` +
    `<div class="lab">Industry boost · Bias &amp; Basket</div>${chips(info.bias)}` +
    `<div class="lab">Industry boost · 5Y Winners</div>${chips(info.winners)}`;
  tip.hidden = false;
  const zr = z.getBoundingClientRect(), br = box.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  const cx = zr.left + zr.width / 2 - br.left;
  tip.style.left = Math.min(Math.max(8, cx - w / 2), br.width - w - 8) + 'px';
  tip.style.top = Math.max(8, zr.top - br.top - h - 8) + 'px';
});
sunfg.addEventListener('mouseout', e => { if (e.target.closest('.zs')) tip.hidden = true; });

function sunAt(logical) {
  const i = Math.round(logical);
  return data.sunSegs.find(s => i >= s.from && i <= s.to);
}

// ---------------- Time Geometry Top 5 ----------------
// The Time Geometry tab saves its Top 5 next-swing dates to localStorage
// ('cg.tg.top5'). Two vertical lines are drawn from it: a solid one on the
// rank #1 date and a dashed one on the nearest of the five dates (one line
// when they are the same date). Only a Top 5 made from this chart's own swing
// profile ("<title> · chart") is drawn, so another stock's dates never show.
const tgl = document.getElementById('tgl');
const allTimes = data.candles.map(c => c.time)
  .concat(data.moonSeries.map(x => x.time).filter(t => !byTimeAll(t)));
function byTimeAll(t) { return data.candles.length && typeof t === 'string' && t <= data.candles[data.candles.length - 1].time; }
// bar index for a 'YYYY-MM-DD' date: that bar, or the first bar after it
function barOf(d) {
  if (typeof allTimes[0] !== 'string') return -1;            // intraday chart: not used
  let lo = 0, hi = allTimes.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (allTimes[m] < d) lo = m + 1; else hi = m; }
  return lo < allTimes.length ? lo : -1;
}
let tgOn = true, tgFrame = 0, tgLines = [];
function loadTop5() {
  tgLines = [];
  let v = null;
  try { v = JSON.parse(localStorage.getItem('cg.tg.top5') || 'null'); } catch (e) {}
  if (!v || !v.dates || !v.dates.length || v.profile !== data.title + ' · chart') return;
  const color = v.kind === 'low' ? '#2196f3' : '#f0b90b';
  const sw = v.kind === 'low' ? 'swing low' : 'swing high';
  const first = v.dates.find(x => x.rank === 1);
  const near = v.dates.reduce((a, b) => (b.d < a.d ? b : a));
  const show = d => `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(2, 4)}`;
  if (first) tgLines.push({ i: barOf(first.d), color, near: false,
    text: `#1${near.d === first.d ? ' · terdekat' : ''} ${sw} ${show(first.d)}` });
  if (near.d !== (first || {}).d) tgLines.push({ i: barOf(near.d), color, near: true,
    text: `#${near.rank} terdekat ${show(near.d)}` });
  tgLines = tgLines.filter(l => l.i >= 0);
}
function drawTg() {
  tgFrame = 0;
  const pw = el.clientWidth - chart.priceScale('right').width();
  const ph = el.clientHeight - ts.height();
  tgl.style.width = pw + 'px'; tgl.style.height = ph + 'px';
  let h = '';
  if (tgOn) tgLines.forEach((l, k) => {
    const x = ts.logicalToCoordinate(l.i);
    if (x === null || x < 0 || x > pw) return;
    h += `<div class="ln${l.near ? ' near' : ''}" style="left:${x - 1}px;border-color:${l.color}"></div>` +
         `<div class="lb" style="left:${Math.min(Math.max(x, 70), pw - 70)}px;top:${40 + k * 22}px;background:${l.color}">${esc(l.text)}</div>`;
  });
  tgl.innerHTML = h;
}
const redrawTg = () => { if (!tgFrame) tgFrame = requestAnimationFrame(drawTg); };
ts.subscribeVisibleLogicalRangeChange(redrawTg);
new ResizeObserver(redrawTg).observe(el);
window.addEventListener('storage', e => { if (e.key === 'cg.tg.top5') { loadTop5(); redrawTg(); } });
loadTop5();

// ---------------- Backtest: next dates of strong events ----------------
// After an Astronomy · Backtest run, every event whose swing % is at least 70%
// gets a ◆ on the bar of its next occurrence (data.btNext). Several events on
// one bar share a marker; the legend lists them when the crosshair is there.
const btByTime = new Map();
for (const m of data.btNext || []) {
  const i = barOf(m.date);
  if (i < 0) continue;
  const t = allTimes[i];
  if (!btByTime.has(t)) btByTime.set(t, []);
  btByTime.get(t).push(m);
}
const btSeries = chart.addLineSeries({
  priceScaleId: 'btnext', color: 'rgba(0,0,0,0)', lineVisible: false,
  lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false,
});
chart.priceScale('btnext').applyOptions({ visible: false, scaleMargins: { top: 0.12, bottom: 0.84 } });
const btTimes = allTimes.filter(t => btByTime.has(t));
btSeries.setData(btTimes.map(t => ({ time: t, value: 0 })));
const btMarkers = btTimes.map(t => {
  const ms = btByTime.get(t), top = Math.max(...ms.map(m => m.pct));
  return { time: t, position: 'aboveBar', color: '#c77dff', shape: 'arrowDown',
           text: `◆ ${top.toLocaleString('id-ID', { maximumFractionDigits: 1 })}%` + (ms.length > 1 ? ` +${ms.length - 1}` : '') };
});
let btOn = true;

// ---------------- legend ----------------
const byTime = new Map(data.candles.map((c, i) => [JSON.stringify(c.time), i]));
const legend = document.getElementById('legend');
const fmt = idPrice;
let volOn = true, moonOn = true;
function showLegend(i) {
  const c = data.candles[i], v = data.volumes[i];
  const chg = i > 0 ? (c.close / data.candles[i-1].close - 1) * 100 : 0;
  const col = c.close >= c.open ? '#26a69a' : '#ef5350';
  legend.innerHTML = `<span class="t">${data.title}</span>` +
    `<span class="k">O</span> <span style="color:${col}">${fmt(c.open)}</span>` +
    `<span class="k">H</span> <span style="color:${col}">${fmt(c.high)}</span>` +
    `<span class="k">L</span> <span style="color:${col}">${fmt(c.low)}</span>` +
    `<span class="k">C</span> <span style="color:${col}">${fmt(c.close)}</span>` +
    `<span style="color:${col}"> (${idPct(chg)})</span>` +
    (volOn ? `<span class="k">Vol</span> ${fmt(v.value)}` : '');
}
function updateLegend(p) {
  const i = p && p.time !== undefined ? byTime.get(JSON.stringify(p.time)) : undefined;
  showLegend(i !== undefined ? i : data.candles.length - 1);
  const logical = p && p.logical !== undefined ? p.logical : data.candles.length - 1;
  const s = sunOn ? sunAt(logical) : null;
  if (s) legend.innerHTML += `<span class="k">Sun</span> ${(data.sunInfo[s.sign] || {}).symbol || ''}&#xFE0E; ${s.sign}`;
  const m = moonOn && p && p.time !== undefined ? moonByTime.get(p.time) : undefined;
  if (m) legend.innerHTML += `<span class="k">${m[0] === 'FULL' ? '🌕 Full moon' : '🌑 New moon'}</span> ${m[1].slice(0, 16)} WIB`;
  // ◆ strong backtest events whose next occurrence falls on this bar
  const bm = btOn && p && p.time !== undefined ? btByTime.get(p.time) : undefined;
  if (bm) legend.innerHTML += `<div style="margin-top:3px;color:#c77dff">◆ ${bm.map(x =>
    `${esc(x.event)} ${x.time} WIB (${x.pct.toLocaleString('id-ID')}% swing)`).join(' · ')}</div>`;
}
chart.subscribeCrosshairMove(updateLegend);

// ---------------- indicator toggles ----------------
// Every indicator on the chart is listed here with an eye button to show or
// hide it. The choice is remembered in this browser.
const EYE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
// ---- swing indicators ----
// "Swing ^ v" and "Denoised Swing" never show together: switching one on
// switches the other off. Denoised Swing merges N candles into one (N set in
// the box under it) and keeps only the swings that survive. "Mother Candle
// Swing" adds an ⓘ to a swing bar whose next bar sits inside it.
// The active choice is kept in localStorage ('cg.ind.*', 'cg.denoise.n'); the
// Time Geometry tab listens for it and refills its swing dates.
let swingOn = false, dswingOn = false, motherOn = false;
const clampN = v => Math.min(data.denoiseMax, Math.max(1, Math.round(+v) || 1));
let denoiseN = 1;
const motherSet = new Set(data.mother);
function applySwings() {
  const pts = swingOn ? data.swings['1'] : dswingOn ? data.swings[String(denoiseN)] : [];
  const out = [];
  for (const [i, k] of pts) {
    const t = data.candles[i].time, hi = k === 'SH';
    const pos = hi ? 'aboveBar' : 'belowBar';
    // below a bar markers stack downwards, above a bar upwards: put ⓘ on the outside
    const sym = { time: t, position: pos, color: hi ? '#f0b90b' : '#2196f3', shape: 'circle', size: 0, text: hi ? '^' : 'v' };
    const info = { time: t, position: pos, color: '#d1d4dc', shape: 'circle', size: 0, text: 'ⓘ' };
    out.push(sym);
    if (motherOn && motherSet.has(i)) out.push(info);
  }
  candle.setMarkers(out);
}
const INDICATORS = [
  { id: 'sun', name: 'Sun in Sign', def: true, apply: on => { sunOn = on; drawSun(); } },
  { id: 'moon', name: 'Moon Phase', def: true, apply: on => { moonOn = on; moon.setMarkers(on ? data.moonMarkers : []); } },
  { id: 'swing', name: 'Swing ^ v', def: true, excl: 'dswing', apply: on => { swingOn = on; applySwings(); } },
  { id: 'dswing', name: 'Denoised Swing', def: false, excl: 'swing', apply: on => { dswingOn = on; applySwings(); } },
  { id: 'mother', name: 'Mother Candle Swing', def: true, apply: on => { motherOn = on; applySwings(); } },
  { id: 'btnext', name: 'Event Backtest ≥70%', def: true, apply: on => { btOn = on; btSeries.setMarkers(on ? btMarkers : []); } },
  { id: 'tg', name: 'Top 5 Time Geometry', def: true, apply: on => { tgOn = on; redrawTg(); } },
  { id: 'vol', name: 'Volume', def: true, apply: on => { volOn = on; vol.applyOptions({ visible: on }); } },
];
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
};
denoiseN = clampN(store.get('cg.denoise.n') || 1);
const list = document.getElementById('indList');
const setters = {};
INDICATORS.forEach(ind => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'ind-row';
  list.appendChild(btn);
  let opt = null;
  if (ind.id === 'dswing') {
    opt = document.createElement('label');
    opt.className = 'ind-opt';
    opt.innerHTML = `Candle <input type="number" min="1" max="${data.denoiseMax}" step="1" value="${denoiseN}" ` +
                    `title="Jumlah candle yang digabung jadi 1 (1–${data.denoiseMax})">`;
    list.appendChild(opt);
    const inp = opt.querySelector('input');
    inp.addEventListener('change', () => {
      denoiseN = clampN(inp.value); inp.value = denoiseN;
      store.set('cg.denoise.n', String(denoiseN));
      applySwings();
    });
  }
  const set = on => {
    btn.classList.toggle('off', !on);
    if (opt) opt.classList.toggle('off', !on);
    btn.setAttribute('aria-pressed', String(on));
    btn.title = (on ? 'Sembunyikan ' : 'Tampilkan ') + ind.name;
    btn.innerHTML = (on ? EYE : EYE_OFF) + `<span class="nm">${ind.name}</span>`;
    store.set('cg.ind.' + ind.id, on ? '1' : '0');
    if (on && ind.excl && setters[ind.excl] && setters[ind.excl].isOn()) setters[ind.excl].set(false);
    ind.apply(on);
    updateLegend();
  };
  setters[ind.id] = { set, isOn: () => !btn.classList.contains('off') };
  btn.addEventListener('click', () => set(btn.classList.contains('off')));
});
INDICATORS.forEach(ind => {
  const saved = store.get('cg.ind.' + ind.id);
  let on = saved === null ? ind.def : saved === '1';
  if (ind.id === 'dswing' && on && setters.swing.isOn()) on = false;   // never both on
  setters[ind.id].set(on);
});

// ---------------- price scale switches (% / log / auto) ----------------
// %    : the Y axis reads as percent change from the Open of the leftmost
//        bar on screen (that Open = 0%; e.g. 0%, +15%, −5%). Scrolling or
//        zooming picks the new leftmost bar as 0%. Off = plain prices.
//        Done by drawing the candles as price / base × 100, so the axis gets
//        round steps; labels show that value − 100 as a percent. The legend
//        keeps the real prices. Works together with log.
// log  : logarithmic scale; off = linear.
// auto : the scale follows the high/low of the visible bars. Dragging the
//        price axis switches it off (the chart library does that); a
//        double-click on the axis or the button switches it back on.
// % and log are remembered in this browser; auto always starts on.
const rightScale = chart.priceScale('right');
const PRICE_FMT = { type: 'custom', formatter: idPrice, minMove: 0.01 };
const PCT_FMT = { type: 'custom', minMove: 0.01, formatter: v => {
  const d = v - 100;
  if (Math.abs(d) < 0.005) return '0%';
  return (d < 0 ? '−' : '+') + idNum(Math.abs(d), 0, 2) + '%';
} };
let pctOn = store.get('cg.scale.pct') === '1', logOn = store.get('cg.scale.log') === '1', pctBase;   // undefined until the first applyPct()
function leftmostOpen() {
  const r = ts.getVisibleLogicalRange();
  const i = r ? Math.min(data.candles.length - 1, Math.max(0, Math.ceil(r.from))) : 0;
  return data.candles[i].open;
}
function applyPct() {
  const base = pctOn ? leftmostOpen() : null;
  if (base === pctBase) return;
  const switching = (base === null) !== (pctBase === null || pctBase === undefined);
  pctBase = base;
  const k = base === null ? 1 : 100 / base;
  candle.setData(base === null ? data.candles : data.candles.map(c => ({
    time: c.time, open: c.open * k, high: c.high * k, low: c.low * k, close: c.close * k })));
  candle.applyOptions({ priceFormat: base === null ? PRICE_FMT : PCT_FMT });
  // price <-> percent: a manually set range would be in the wrong units
  if (switching) rightScale.applyOptions({ autoScale: true });
}
function syncScaleButtons() {
  const st = { pct: pctOn, log: logOn, auto: rightScale.options().autoScale };
  scalebar.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', st[b.dataset.k]);
    b.setAttribute('aria-pressed', String(st[b.dataset.k]));
  });
}
scalebar.addEventListener('click', e => {
  const k = (e.target.closest('button') || {}).dataset?.k;
  if (k === 'pct') { pctOn = !pctOn; store.set('cg.scale.pct', pctOn ? '1' : '0'); applyPct(); }
  if (k === 'log') {
    logOn = !logOn; store.set('cg.scale.log', logOn ? '1' : '0');
    rightScale.applyOptions({ mode: logOn ? LightweightCharts.PriceScaleMode.Logarithmic : LightweightCharts.PriceScaleMode.Normal });
  }
  if (k === 'auto') rightScale.applyOptions({ autoScale: !rightScale.options().autoScale });
  syncScaleButtons();
});
// the library changes autoScale itself on axis drag / double-click: mirror it
for (const ev of ['pointerup', 'dblclick', 'wheel']) el.addEventListener(ev, () => setTimeout(syncScaleButtons, 0), true);
let pctFrame = 0;
ts.subscribeVisibleLogicalRangeChange(() => {
  if (pctOn && !pctFrame) pctFrame = requestAnimationFrame(() => { pctFrame = 0; applyPct(); });
});
if (logOn) rightScale.applyOptions({ mode: LightweightCharts.PriceScaleMode.Logarithmic });

// Start zoomed on the most recent ~150 bars plus the next few weeks.
const n = data.candles.length;
const ahead = Math.min(25, data.moonSeries.filter(x => !byTime.has(JSON.stringify(x.time))).length);
// ...and far enough right to show the first ◆ backtest event mark.
const firstBt = btTimes.length ? allTimes.indexOf(btTimes[0]) - n + 12 : 0;
if (n > 150) ts.setVisibleLogicalRange({ from: n - 150, to: n + Math.max(5, ahead, firstBt) });
else ts.fitContent();
applyPct();
syncScaleButtons();
redrawSun();
</script>
